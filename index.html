<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#111827">
  <title>Rapid Ads</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
    .app{max-width:520px;margin:auto;padding:18px}
    .hero{background:#111827;color:white;border-radius:22px;padding:22px;margin-bottom:16px}
    .brand{font-size:25px;font-weight:800}
    .muted{opacity:.72;font-size:13px}
    .balance{font-size:34px;font-weight:800;margin-top:18px}
    .card{background:white;border-radius:18px;padding:18px;margin-bottom:14px;border:1px solid #e5e7eb}
    .title{font-size:18px;font-weight:750;margin-bottom:8px}
    button{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;background:#111827;color:white}
    button.secondary{background:#e5e7eb;color:#111827}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .stat{background:#f9fafb;border-radius:14px;padding:14px}
    .value{font-size:19px;font-weight:750;margin-top:5px}
    #status{margin-top:12px;font-size:13px;line-height:1.4}
  </style>
</head>
<body>
<div class="app">
  <section class="hero">
    <div class="brand">🚀 Rapid Ads</div>
    <div class="muted" id="welcome">Earn rewards by completing available tasks.</div>
    <div class="balance" id="balance">$0.00</div>
    <div class="muted">Available balance</div>
  </section>

  <section class="card">
    <div class="title">🎬 Earn</div>
    <div class="muted" style="margin-bottom:14px">
      Your advertising dashboard will appear here after the secure backend connection is added.
    </div>
    <button id="watch">Watch Ads</button>
    <div id="status"></div>
  </section>

  <section class="card">
    <div class="title">📊 Account</div>
    <div class="grid">
      <div class="stat"><div class="muted">Total Earned</div><div class="value">$0.00</div></div>
      <div class="stat"><div class="muted">Referrals</div><div class="value">0</div></div>
    </div>
  </section>

  <section class="card">
    <div class="title">💸 Wallet</div>
    <div class="grid">
      <button class="secondary" id="withdraw">Withdraw</button>
      <button class="secondary" id="referrals">Referrals</button>
    </div>
  </section>
</div>

<script>
(function(){
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (user) {
      document.getElementById("welcome").textContent =
        "Welcome, " + (user.first_name || "User") + "!";
    }
  }

  document.getElementById("watch").addEventListener("click", function(){
    document.getElementById("status").textContent =
      "Ad system connection will be added next. No reward is being credited yet.";
  });

  document.getElementById("withdraw").addEventListener("click", function(){
    document.getElementById("status").textContent =
      "Withdrawal system will be connected to your existing Rapid Ads bot.";
  });

  document.getElementById("referrals").addEventListener("click", function(){
    document.getElementById("status").textContent =
      "Referral system will be connected to your existing Rapid Ads bot.";
  });
})();
</script>
</body>
</html>
